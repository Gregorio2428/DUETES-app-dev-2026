<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div id="nav"></div>
  <main>
    <h1 id="greeting">Loading...</h1>
    <p class="sub" id="details"></p>
    <div class="grid">
      <a class="card" href="/about.html" style="text-decoration:none;color:inherit"><h3>About Me &rarr;</h3><p class="sub">See your username, email and bio.</p></a>
      <a class="card" href="/users.html" style="text-decoration:none;color:inherit"><h3>Users &rarr;</h3><p class="sub">Meet everyone registered here.</p></a>
    </div>
  </main>
  <script src="/js/app.js"></script>
  <script>
    requireLogin();
    renderNav("dashboard");
    api("/api/users/me").then((user) => {
      document.getElementById("greeting").textContent = `Hello, ${user.name} 👋`;
      document.getElementById("details").textContent = `Signed in as ${user.email}`;
    });
  </script>
</body>
</html>
