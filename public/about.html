<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>About Me</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div id="nav"></div>
  <main>
    <h1>About Me</h1>
    <p class="sub">Protected route: <code>GET /api/users/about-me</code></p>
    <div class="card" id="card">Loading...</div>
  </main>
  <script src="/js/app.js"></script>
  <script>
    requireLogin();
    renderNav("about");
    const esc = (t) => { const d = document.createElement("div"); d.textContent = t; return d.innerHTML; };

    api("/api/users/about-me").then((u) => {
      document.getElementById("card").innerHTML = `
        <div class="profile">
          <div class="avatar">${esc(initial(u.username))}</div>
          <div><h2 style="margin:0">${esc(u.username)}</h2>
          <span class="sub">Member since ${new Date(u.joinedAt).toLocaleDateString()}</span></div>
        </div>
        <div class="row"><small>Username</small>${esc(u.username)}</div>
        <div class="row"><small>Email</small>${esc(u.email)}</div>
        <div class="row"><small>Bio</small>${u.bio ? esc(u.bio) : '<span class="empty">No bio yet.</span>'}</div>`;
    }).catch((e) => (document.getElementById("card").textContent = e.message));
  </script>
</body>
</html>
