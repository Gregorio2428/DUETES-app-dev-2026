<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up | Latch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="auth">

  <aside class="panel">
    <a class="wordmark" href="/login">
      <svg viewBox="0 0 100 140" aria-hidden="true"><circle cx="50" cy="42" r="30"/><path d="M36 60h28l12 70H24z"/></svg>
      Latch
    </a>
    <div>
      <h1>Make yourself at home.</h1>
      <p>Three details and you're in. Your password is scrambled before it is stored.</p>
    </div>
    <svg class="keyhole-bg" viewBox="0 0 100 140" aria-hidden="true"><circle cx="50" cy="42" r="30"/><path d="M36 60h28l12 70H24z"/></svg>
  </aside>

  <main class="form-side">
    <div class="form-wrap">
      <h2>Create your account</h2>
      <p class="lede">It takes about half a minute.</p>

      <!-- novalidate: the server does the validating, so its 400 errors are what you see. -->
      <form id="signup-form" novalidate>
        <div class="alert" role="alert" hidden></div>

        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" aria-describedby="email-error">
          <p class="field-error" id="email-error"></p>
        </div>

        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" autocomplete="username" placeholder="ada_lovelace" aria-describedby="username-error">
          <p class="field-error" id="username-error"></p>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="password-wrap">
            <input id="password" name="password" type="password" autocomplete="new-password" aria-describedby="password-error meter-label">
            <button type="button" class="toggle-visibility" aria-pressed="false" aria-controls="password">Show</button>
          </div>
          <div class="meter" id="meter" data-level="0" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
          <p class="hint" id="meter-label">Longer is stronger. Mix letters, numbers and symbols.</p>
          <p class="field-error" id="password-error"></p>
        </div>

        <button class="btn btn-primary" type="submit">Create account</button>
      </form>

      <p class="switch">Already have an account? <a href="/login">Log in</a></p>
    </div>
  </main>

  <script src="/js/shared.js"></script>
  <script src="/js/signup.js"></script>
</body>
</html>
