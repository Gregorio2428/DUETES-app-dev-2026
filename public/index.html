<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log in</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <main style="max-width:400px;padding-top:4rem">
    <h1>Welcome 👋</h1>
    <p class="sub">Log in to see the secured pages.</p>
    <div class="card">
      <div class="tabs">
        <button class="btn ghost on" id="tab-login">Log in</button>
        <button class="btn ghost" id="tab-register">Create account</button>
      </div>
      <p class="msg" id="message"></p>

      <form id="login-form">
        <input type="email" id="login-email" placeholder="Email" required />
        <input type="password" id="login-password" placeholder="Password" required />
        <button class="btn full" type="submit">Log in</button>
      </form>

      <form id="register-form" hidden>
        <input type="text" id="reg-name" placeholder="Username" required />
        <input type="email" id="reg-email" placeholder="Email" required />
        <input type="password" id="reg-password" placeholder="Password (min 8 characters)" required />
        <textarea id="reg-bio" maxlength="160" placeholder="Short bio (optional)"></textarea>
        <p class="hint"><span id="bio-count">0</span>/160</p>
        <button class="btn full" type="submit">Create account</button>
      </form>
    </div>
  </main>

  <script>
    const message = document.getElementById("message");
    const loginForm = document.getElementById("login-form");
    const registerForm = document.getElementById("register-form");

    function show(text, ok = false) { message.textContent = text; message.className = "msg" + (ok ? " ok" : ""); }

    function switchTab(toLogin) {
      loginForm.hidden = !toLogin;
      registerForm.hidden = toLogin;
      document.getElementById("tab-login").classList.toggle("on", toLogin);
      document.getElementById("tab-register").classList.toggle("on", !toLogin);
      show("");
    }
    document.getElementById("tab-login").addEventListener("click", () => switchTab(true));
    document.getElementById("tab-register").addEventListener("click", () => switchTab(false));

    // Shows "Your session expired" when we were bounced here by an expired token
    const reason = new URLSearchParams(location.search).get("reason");
    if (reason) show(reason);

    document.getElementById("reg-bio").addEventListener("input", (e) => {
      document.getElementById("bio-count").textContent = e.target.value.length;
    });

    async function post(url, body) {
      const res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      return { ok: res.ok, data: await res.json() };
    }

    registerForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const { ok, data } = await post("/api/auth/register", {
        name: document.getElementById("reg-name").value,
        email: document.getElementById("reg-email").value,
        password: document.getElementById("reg-password").value,
        bio: document.getElementById("reg-bio").value,
      });
      if (ok) { switchTab(true); show(data.message, true); } else show(data.error);
    });

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const { ok, data } = await post("/api/auth/login", {
        email: document.getElementById("login-email").value,
        password: document.getElementById("login-password").value,
      });
      if (!ok) return show(data.error);
      localStorage.setItem("token", data.token); // keep the "wristband"
      window.location.href = "/dashboard.html";
    });
  </script>
</body>
</html>
