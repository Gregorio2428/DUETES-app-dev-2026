<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>your task orbit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="orb o1"></div>
<div class="orb o2"></div>
<div class="orb o3"></div>

<div class="app">
  <div class="titlecard">
    <h1>TO-DO-LIST</h1>
    <p>your tasks, saved right here in this browser</p>
  </div>

  <div class="panel">
    <form id="task-form" novalidate>
      <input type="text" id="task-input" placeholder="What do you need to do?" autocomplete="off">
      <button type="submit" id="add-btn">Add</button>
    </form>
    <p class="error-msg" id="error-msg"></p>
  </div>

  <div class="panel">
    <div class="list-header">
      <h2>Your tasks</h2>
      <span id="task-count">0 tasks</span>
    </div>
    <ul id="task-list"></ul>
    <div class="empty-state" id="empty-state">
      <span class="emoji">🦊</span>
      No tasks yet — add your first one above.
    </div>
  </div>

  <div class="footer-row">
    <button id="delete-all-btn" type="button">
      <span class="spinner"></span>
      <span class="btn-label">Delete all</span>
    </button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
